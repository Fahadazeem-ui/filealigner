name: Build Windows exe
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct listing.py (identity-only deep peeks)
        shell: bash
        run: |
          python - <<'PY'
          import base64, zlib
          from pathlib import Path
          d = Path("fsengine")
          parts = []
          i = 0
          while (d / f"_listing_z{i}.txt").exists():
              parts.append((d / f"_listing_z{i}.txt").read_text(encoding="utf-8").strip())
              i += 1
          if not parts:
              raise SystemExit("missing _listing_z*.txt")
          src = zlib.decompress(base64.b64decode("".join(parts))).decode("utf-8")
          (d / "listing.py").write_text(src, encoding="utf-8")
          assert "class ZipListing" in src
          print("listing.py OK", len(src))
          PY
      - name: Verify imports
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          import queue, threading, tkinter
          from fsengine.listing import open_listing, is_identity_member
          from fsengine.classify import Engine
          assert is_identity_member("mimetype")
          print("stdlib + engine OK")
          PY
      - name: Install and build
        run: |
          pip install pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name FileSorter --collect-submodules fsengine --hidden-import=queue --hidden-import=threading --hidden-import=tkinter --hidden-import=tkinter.ttk --hidden-import=tkinter.filedialog --hidden-import=tkinter.messagebox --hidden-import=json --hidden-import=zlib --hidden-import=base64 --hidden-import=argparse --hidden-import=pathlib file_sorter.py
      - uses: actions/upload-artifact@v4
        with:
          name: FileSorter-exe
          path: dist/FileSorter.exe
