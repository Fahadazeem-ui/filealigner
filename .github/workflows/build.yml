name: Build Windows exe + Installer
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: FileSorter-web
          path: dist/
