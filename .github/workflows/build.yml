name: Build Windows exe + Installer
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyinstaller pywebview
      - name: Verify glass UI
        shell: bash
        run: |
          python - <<'PY'
          from fsengine.ui_html import _HTML
          assert "backdrop-filter" in _HTML, "no glass css"
          assert "FileSorter" in _HTML
          print("glass UI OK", len(_HTML))
          from fsengine.listing import is_identity_member
          assert is_identity_member("mimetype")
          print("listing OK")
          PY
      - name: Build exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name FileSorter --collect-submodules fsengine --collect-all webview --hidden-import=queue --hidden-import=threading --hidden-import=tkinter --hidden-import=webview --hidden-import=fsengine.glass_app --hidden-import=fsengine.ui_html --hidden-import=fsengine._uh0 --hidden-import=fsengine._uh1 --hidden-import=fsengine._uh2 --hidden-import=fsengine._uh3 --hidden-import=fsengine._uh4 --hidden-import=fsengine._uh5 --hidden-import=fsengine._uh6 --hidden-import=fsengine._uh7 --hidden-import=fsengine._uh8 --hidden-import=fsengine._uh9 file_sorter.py
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        continue-on-error: true
      - name: Build installer
        shell: cmd
        run: |
          if exist "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ("C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\FileSorter.iss) else (echo no inno)
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: FileSorter-exe
          path: dist/FileSorter.exe
      - uses: actions/upload-artifact@v4
        with:
          name: FileSorter-Setup
          path: dist/FileSorter-Setup-*.exe
        continue-on-error: true
