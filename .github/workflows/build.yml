name: Build Windows exe + Installer
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install pyinstaller pywebview
      - name: Verify glass UI
        shell: bash
        run: |
          python - <<'PY'
          from fsengine.glass_app import _ui_dir
          p = _ui_dir()
          html = (p / "index.html").read_text(encoding="utf-8")
          assert "backdrop-filter" in html
          assert "FileSorter" in html
          from fsengine.listing import is_identity_member
          assert is_identity_member("mimetype")
          print("glass UI OK", len(html))
          PY
      - name: Build exe (glass UI)
        run: |
          pyinstaller --noconfirm --onefile --windowed --name FileSorter --collect-submodules fsengine --collect-all webview --hidden-import=queue --hidden-import=threading --hidden-import=tkinter --hidden-import=webview --hidden-import=fsengine.glass_app --hidden-import=fsengine._ui_blob file_sorter.py
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        continue-on-error: true
      - name: Build installer wizard
        shell: cmd
        run: |
          if exist "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ("C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\FileSorter.iss) else (echo no inno)
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: FileSorter-exe
          path: dist/FileSorter.exe
      - uses: actions/upload-artifact@v4
        with:
          name: FileSorter-Setup
          path: dist/FileSorter-Setup-*.exe
        continue-on-error: true
