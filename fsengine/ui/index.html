<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FileSorter 5.0</title>
<style>
:root,[data-theme="night"]{
  --bg:#0b0e17;--panel:rgba(22,26,40,.72);--panel2:rgba(28,34,52,.78);--text:#eef1ff;--muted:#9aa3c7;
  --accent:#7c9cff;--accent2:#a78bfa;--ok:#34d399;--warn:#fbbf24;--danger:#f87171;
  --border:rgba(255,255,255,.08);--glass:blur(18px) saturate(1.4);
  --aurora1:rgba(99,102,241,.35);--aurora2:rgba(168,85,247,.28);--aurora3:rgba(56,189,248,.22);
}
[data-theme="cool"]{
  --bg:#0a1218;--panel:rgba(18,32,48,.72);--panel2:rgba(24,40,58,.78);--text:#e8f4ff;--muted:#8fb4d4;
  --accent:#38bdf8;--accent2:#818cf8;--ok:#2dd4bf;--warn:#fbbf24;--danger:#fb7185;
  --border:rgba(255,255,255,.08);--glass:blur(18px) saturate(1.4);
  --aurora1:rgba(56,189,248,.32);--aurora2:rgba(129,140,248,.28);--aurora3:rgba(45,212,191,.2);
}
[data-theme="warm"]{
  --bg:#120c14;--panel:rgba(40,24,36,.72);--panel2:rgba(52,32,48,.78);--text:#fff1f5;--muted:#c9a0b0;
  --accent:#fb7185;--accent2:#c084fc;--ok:#34d399;--warn:#fbbf24;--danger:#f87171;
  --border:rgba(255,255,255,.08);--glass:blur(18px) saturate(1.4);
  --aurora1:rgba(251,113,133,.32);--aurora2:rgba(192,132,252,.28);--aurora3:rgba(251,191,36,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
body::before{content:"";position:fixed;inset:-20%;background:
  radial-gradient(ellipse 60% 50% at 20% 30%,var(--aurora1),transparent 60%),
  radial-gradient(ellipse 50% 40% at 80% 20%,var(--aurora2),transparent 55%),
  radial-gradient(ellipse 45% 50% at 50% 80%,var(--aurora3),transparent 50%);
  filter:blur(40px);z-index:0;pointer-events:none;animation:aurora 18s ease-in-out infinite alternate}
@keyframes aurora{0%{transform:translate(0,0) scale(1)}100%{transform:translate(2%,-2%) scale(1.05)}}
.app{position:relative;z-index:1;display:grid;grid-template-columns:240px 1fr;height:100vh;gap:0}
.sidebar{backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);background:var(--panel);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;gap:8px}
.logo{font-weight:700;font-size:18px;letter-spacing:.02em;padding:8px 12px;margin-bottom:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-btn{appearance:none;border:1px solid transparent;background:transparent;color:var(--muted);padding:10px 14px;border-radius:12px;text-align:left;cursor:pointer;font-size:13.5px;transition:.15s}
.nav-btn:hover{background:rgba(255,255,255,.05);color:var(--text)}
.nav-btn.active{background:rgba(124,156,255,.15);border-color:rgba(124,156,255,.25);color:var(--text)}
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);background:var(--panel2);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px}
.topbar h1{font-size:16px;font-weight:600;flex:1}
.btn{appearance:none;border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13px;transition:.15s}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.content{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.card{backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px 18px}
.card h2{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select{background:rgba(0,0,0,.25);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:10px;font-size:13px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.04);cursor:pointer;font-size:12px;color:var(--muted)}
.chip.on{background:rgba(124,156,255,.2);border-color:rgba(124,156,255,.4);color:var(--text)}
.table{width:100%;border-collapse:collapse;font-size:12.5px}
.table th,.table td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left}
.table th{color:var(--muted);font-weight:500}
.preview-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.from{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.to{color:var(--ok);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arrow{color:var(--accent)}
.status{font-size:12px;color:var(--muted);padding:8px 0}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);z-index:50;display:none;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{width:min(720px,92vw);max-height:85vh;overflow:auto;backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);background:var(--panel2);border:1px solid var(--border);border-radius:18px;padding:20px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:7px 12px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:12px}
.tab.on{background:rgba(124,156,255,.18);color:var(--text);border-color:rgba(124,156,255,.35)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;color:var(--muted)}
@media (max-width:800px){.app{grid-template-columns:1fr}.sidebar{display:none}}
</style></head><body data-theme="night">
<div class="app" id="app">
  <aside class="sidebar">
    <div class="logo">FileSorter 5.0</div>
    <button class="nav-btn active" data-mode="sort" onclick="setMode('sort')">Sort</button>
    <button class="nav-btn" data-mode="search" onclick="setMode('search')">Search</button>
    <button class="nav-btn" data-mode="cleanup" onclick="setMode('cleanup')">Cleanup</button>
    <div style="flex:1"></div>
    <button class="nav-btn" onclick="openSettings()">Settings</button>
  </aside>
  <section class="main">
    <div class="topbar">
      <h1 id="title">Sort</h1>
      <button class="btn" onclick="pickFolder()">Browse</button>
      <button class="btn primary" onclick="runAction()">Run</button>
    </div>
    <div class="content">
      <div class="card" id="controls">
        <div class="row">
          <input id="path" placeholder="Folder path (or whole PC for search)" style="flex:1;min-width:200px"/>
          <input id="query" placeholder="Search keywords" style="flex:1;min-width:160px;display:none"/>
        </div>
        <div class="chips" id="typeChips" style="margin-top:10px;display:none">
          <span class="chip" data-t="image" onclick="toggleChip(this)">Pictures</span>
          <span class="chip" data-t="video" onclick="toggleChip(this)">Video</span>
          <span class="chip" data-t="document" onclick="toggleChip(this)">Documents</span>
          <span class="chip" data-t="archive" onclick="toggleChip(this)">Archives</span>
          <span class="chip" data-t="audio" onclick="toggleChip(this)">Audio</span>
        </div>
      </div>
      <div class="card">
        <h2 id="previewHead">FROM → TO</h2>
        <div id="preview"></div>
        <div class="status" id="status">Ready — Browse a real folder, then Run</div>
        <div class="row" style="margin-top:12px"><button class="btn primary" id="btnApply" style="display:none" onclick="applySort()">Apply moves</button></div>
      </div>
    </div>
  </section>
</div>
<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <div class="tabs">
      <button class="tab on" data-tab="appearance" onclick="setTab(this)">Appearance</button>
      <button class="tab" data-tab="interaction" onclick="setTab(this)">Interaction</button>
      <button class="tab" data-tab="sort" onclick="setTab(this)">Sort</button>
      <button class="tab" data-tab="search" onclick="setTab(this)">Search</button>
      <button class="tab" data-tab="performance" onclick="setTab(this)">Performance</button>
      <button class="tab" data-tab="cleanup" onclick="setTab(this)">Cleanup</button>
    </div>
    <div id="settingsBody"></div>
    <div class="row" style="margin-top:16px;justify-content:flex-end">
      <button class="btn" onclick="closeSettings()">Cancel</button>
      <button class="btn primary" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>
<script>
let mode='sort', settings={}, chips=new Set();
function st(m){document.getElementById('status').textContent=m}
function setMode(m){
  mode=m;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  document.getElementById('title').textContent=m[0].toUpperCase()+m.slice(1);
  document.getElementById('query').style.display=m==='search'?'':'none';
  document.getElementById('typeChips').style.display=m==='search'?'flex':'none';
  document.getElementById('previewHead').textContent=m==='search'?'Results':m==='cleanup'?'Versions':'FROM → TO';
  document.getElementById('preview').innerHTML='';
  document.getElementById('btnApply').style.display='none';
  st('Ready');
}
function toggleChip(el){const t=el.dataset.t;if(chips.has(t)){chips.delete(t);el.classList.remove('on')}else{chips.add(t);el.classList.add('on')}}
function pickFolder(){if(window.pywebview&&window.pywebview.api&&window.pywebview.api.pick_folder){window.pywebview.api.pick_folder().then(p=>{if(p)document.getElementById('path').value=p})}else{st('Browse requires desktop app')}}
async function runAction(){
  const path=document.getElementById('path').value.trim();
  const q=document.getElementById('query').value.trim();
  st('Working…');
  try{
    if(!window.pywebview||!window.pywebview.api){st('API unavailable (open via FileSorter.exe)');return}
    const api=window.pywebview.api;
    if(mode==='sort'){
      const res=await api.sort_preview(path||'');
      renderSort(res);
    }else if(mode==='search'){
      const res=await api.search(q, path||'', Array.from(chips));
      renderSearch(res);
    }else{
      const res=await api.cleanup_scan(path||'');
      renderCleanup(res);
    }
  }catch(e){st('Error: '+e)}
}
function renderSort(res){
  const el=document.getElementById('preview');
  if(res&&res.error){el.innerHTML='<div class="status">'+esc(res.error)+'</div>';st(res.error);document.getElementById('btnApply').style.display='none';return}
  if(!res||!res.items||!res.items.length){el.innerHTML='<div class="status">Nothing to move</div>';st('0 items');document.getElementById('btnApply').style.display='none';return}
  el.innerHTML=res.items.map(it=>`<div class="preview-row"><div class="from">${esc(it.src||it.name||'')}</div><div class="arrow">→</div><div class="to">${esc(it.dest||it.to||'')}</div></div>`).join('');
  st(res.items.length+' items');
  document.getElementById('btnApply').style.display=res.items.length?'':'none';
}
function renderSearch(res){
  const el=document.getElementById('preview');
  const hits=(res&&(res.hits||res.items))||[];
  if(!hits.length){el.innerHTML='<div class="status">No matches</div>';st('0');return}
  el.innerHTML=`<table class="table"><thead><tr><th>Name</th><th>Path</th><th>Type</th></tr></thead><tbody>`+
    hits.map(h=>`<tr><td>${esc(h.name||'')}</td><td>${esc(h.path||'')}</td><td>${esc(h.kind||h.type||'')}</td></tr>`).join('')+
    `</tbody></table>`;
  st(hits.length+' results');
}
function renderCleanup(res){
  const el=document.getElementById('preview');
  const groups=(res&&res.groups)||[];
  if(!groups.length){el.innerHTML='<div class="status">No version groups</div>';st('0');return}
  el.innerHTML=groups.map(g=>`<div class="card" style="margin-bottom:8px"><strong>${esc(g.base||'')}</strong><div class="status">${(g.files||[]).map(f=>esc(f)).join('<br/>')}</div></div>`).join('');
  st(groups.length+' groups');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]))}
async function applySort(){
  try{
    if(!window.pywebview||!window.pywebview.api){st('Desktop only');return}
    st('Moving…');
    const r=await window.pywebview.api.sort_apply();
    st('Moved '+(r&&r.moved||0)+', failed '+(r&&r.failed||0));
    document.getElementById('btnApply').style.display='none';
  }catch(e){st('Apply error: '+e)}
}
function openSettings(){document.getElementById('settingsModal').classList.add('open');loadSettingsForm()}
function closeSettings(){document.getElementById('settingsModal').classList.remove('open')}
function setTab(el){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===el));loadSettingsForm(el.dataset.tab)}
async function loadSettingsForm(tab){
  tab=tab||'appearance';
  try{if(window.pywebview&&window.pywebview.api)settings=await window.pywebview.api.get_settings()||{}}catch(e){}
  const body=document.getElementById('settingsBody');
  const a=settings.appearance||{}, i=settings.interaction||{}, se=settings.search||{}, p=settings.performance||{}, c=settings.cleanup||{};
  if(tab==='appearance'){
    body.innerHTML=`<div class="field"><label>Theme</label><select id="s_theme"><option value="aurora_night">Aurora Night</option><option value="aurora_cool">Aurora Cool</option><option value="aurora_warm">Aurora Warm</option></select></div>
    <div class="field"><label>GUI scale %</label><input id="s_scale" type="number" min="75" max="150" value="${a.gui_scale||100}"/></div>
    <div class="field"><label>Density</label><select id="s_density"><option value="comfortable">Comfortable</option><option value="compact">Compact</option></select></div>`;
    document.getElementById('s_theme').value=a.theme||'aurora_night';
    document.getElementById('s_density').value=a.density||'comfortable';
  }else if(tab==='interaction'){
    body.innerHTML=`<div class="field"><label>Confirm sort</label><select id="s_cs"><option value="always">Always</option><option value="many">Many files</option><option value="never">Never</option></select></div>
    <div class="field"><label>Scroll sensitivity</label><input id="s_scroll" type="number" step="0.1" min="0.5" max="2" value="${i.scroll_sensitivity||1}"/></div>`;
    document.getElementById('s_cs').value=i.confirm_sort||'many';
  }else if(tab==='sort'){
    body.innerHTML=`<div class="field"><label>Recursive</label><select id="s_rec"><option value="true">Yes</option><option value="false">No</option></select></div>`;
  }else if(tab==='search'){
    body.innerHTML=`<div class="field"><label>Whole PC</label><select id="s_wpc"><option value="true">Yes</option><option value="false">No</option></select></div>
    <div class="field"><label>Result limit</label><input id="s_lim" type="number" value="${se.result_limit||8000}"/></div>`;
  }else if(tab==='performance'){
    body.innerHTML=`<div class="field"><label>Conservative PC</label><select id="s_cons"><option value="false">Off</option><option value="true">On</option></select></div>`;
  }else{
    body.innerHTML=`<div class="field"><label>Auto-select older</label><select id="s_ao"><option value="true">Yes</option><option value="false">No</option></select></div>`;
  }
}
async function saveSettings(){
  const a=settings.appearance||{}; const i=settings.interaction||{}; const se=settings.search||{}; const p=settings.performance||{}; const c=settings.cleanup||{};
  const stheme=document.getElementById('s_theme'); if(stheme)a.theme=stheme.value;
  const sscale=document.getElementById('s_scale'); if(sscale)a.gui_scale=+sscale.value;
  const sden=document.getElementById('s_density'); if(sden)a.density=sden.value;
  const scs=document.getElementById('s_cs'); if(scs)i.confirm_sort=scs.value;
  const ssc=document.getElementById('s_scroll'); if(ssc)i.scroll_sensitivity=+ssc.value;
  const sw=document.getElementById('s_wpc'); if(sw)se.whole_pc=sw.value==='true';
  const sl=document.getElementById('s_lim'); if(sl)se.result_limit=+sl.value;
  const sco=document.getElementById('s_cons'); if(sco)p.conservative_pc=sco.value==='true';
  const sao=document.getElementById('s_ao'); if(sao)c.auto_select_older=sao.value==='true';
  settings.appearance=a; settings.interaction=i; settings.search=se; settings.performance=p; settings.cleanup=c;
  try{if(window.pywebview&&window.pywebview.api)await window.pywebview.api.save_settings(settings)}catch(e){}
  applyTheme(a.theme); applyScale(a.gui_scale); closeSettings(); st('Settings saved');
}
function applyTheme(t){
  const map={aurora_night:'night',aurora_cool:'cool',aurora_warm:'warm'};
  document.body.setAttribute('data-theme', map[t]||'night');
}
function applyScale(pct){
  const s=Math.max(0.75,Math.min(1.5,(pct||100)/100));
  document.documentElement.style.zoom=s;
}
window.addEventListener('pywebviewready',async()=>{
  try{if(window.pywebview&&window.pywebview.api){settings=await window.pywebview.api.get_settings()||{}; applyTheme((settings.appearance||{}).theme); applyScale((settings.appearance||{}).gui_scale)}}catch(e){}
  st('Ready — live desktop engine');
});
</script></body></html>
